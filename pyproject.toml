[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lg-ax-2026"
version = "0.1.0"
description = "LG AX kitchen planning foundations: shared contracts, synthetic evidence, API and MCP"
requires-python = ">=3.11,<3.12"
dependencies = [
  "editables>=0.5,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.28,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
lgax-api = "lgax_api.server:main"
lgax-mcp = "lgax_mcp.server:main"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
dev-mode-exact = true
packages = [
  "packages/core/src/lgax_core",
  "packages/contracts/src/lgax_contracts",
  "apps/api/src/lgax_api",
  "apps/mcp/src/lgax_mcp",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/contracts/schemas/lgax.schema.json" = "lgax_bootstrap_data/lgax.schema.json"
"data/demo/dataset.json" = "lgax_bootstrap_data/dataset.json"

[tool.ruff]
target-version = "py311"
line-length = 110
