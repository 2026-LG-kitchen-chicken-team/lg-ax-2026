name: Development and evidence checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-and-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - name: Shared instructions and project records
        run: |
          uv run python scripts/sync_agent_rules.py --check
          uv run python scripts/harness.py validate
          uv run python scripts/phase2.py validate
      - name: Regression, phase2 integrity and contract tests
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/check_contracts.py
          uv run python services/inference/build_manifest.py --check
      - name: Actual local MCP transport smoke (no live-model claim)
        run: uv run python scripts/smoke_mcp.py --transport stdio
      - name: Preserve historical deterministic experiments
        run: |
          uv run python scripts/scenario_spike.py
          uv run python scripts/topic_trial.py --check
          uv run python scripts/finalist_probe.py --check
          uv run python scripts/flow_audit.py --check
      # Old ax_workflow.validate is not a current readiness gate. Phase2 checks
      # frozen history and explicitly documents the stale legacy dependencies.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web
  # GPU/model and real ChatGPT/Claude checks require explicit recorded runs.
  # CI never converts fixture success into external integration success.
